[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ios-notify"
version = "0.1.0"
description = "Forward iPhone ANCS notifications to Windows 11 toasts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "win11toast>=0.35; sys_platform == 'win32'",
  "winrt-Windows.Devices.Bluetooth>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Devices.Enumeration>=3.2; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
  "winrt-Windows.UI.Notifications>=3.2; sys_platform == 'win32'",
]

[project.scripts]
ios-notify = "ios_notify.main:run"

[tool.hatch.build.targets.wheel]
packages = ["ios_notify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
